<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vòng Quay May Mắn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #3b1d5e, #140f26 75%);
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.8px;
    }
    .subtitle {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 28px;
      text-align: center;
    }
    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 32px;
    }
    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55), 0 0 0 7px #fbbf24;
    }
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid #ef4444;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
      z-index: 10;
    }
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 50%;
      border: 4px solid #fbbf24;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
    }
    button#spinBtn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      border: none;
      padding: 15px 48px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
      transition: transform 0.15s, opacity 0.2s;
    }
    button#spinBtn:active { transform: scale(0.95); }
    button#spinBtn:disabled { opacity: 0.65; cursor: not-allowed; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #ffffff;
      color: #1e293b;
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
      max-width: 325px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .gift-icon { font-size: 3rem; margin-bottom: 8px; }
    .modal-box h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }
    .modal-box p {
      font-size: 1.65rem;
      font-weight: 800;
      color: #e11d48;
      margin-bottom: 22px;
      line-height: 1.3;
    }
    .modal-box button {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
    }
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }
  </style>
</head>
<body>

  <h1>VÒNG QUAY MAY MẮN</h1>
  <div class="subtitle">Bấm nút bên dưới để thử vận may của bạn</div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="800" height="800"></canvas>
    <div class="center-dot">✨</div>
  </div>

  <button id="spinBtn">QUAY NGAY</button>

  <div class="modal" id="resultModal">
    <div class="modal-box">
      <div class="gift-icon">🎉</div>
      <h2>Chúc mừng bạn nhận được</h2>
      <p id="resultText">Một món quà 🎁</p>
      <button onclick="closeModal()">Nhận quà ngay</button>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const ITEMS = [
      { label: "Trà sữa full topping", color: "#f59e0b" }, // Vị trí 0
      { label: "Một món quà 🎁",       color: "#e11d48" }, // Vị trí 1 (Mặc định trúng)
      { label: "Chúc may mắn lần sau", color: "#64748b" }, // Vị trí 2
      { label: "Một bữa ăn ngon",      color: "#10b981" }, // Vị trí 3
      { label: "Hát tặng 1 bài",       color: "#3b82f6" }, // Vị trí 4
      { label: "Thêm 1 lượt quay",     color: "#8b5cf6" }  // Vị trí 5
    ];

    // Vị trí ô cố định sẽ trúng (1 = "Một món quà 🎁")
    const DEFAULT_WIN_INDEX = 1;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const modal = document.getElementById("resultModal");
    const resultText = document.getElementById("resultText");

    const numSlices = ITEMS.length;
    const arc = (2 * Math.PI) / numSlices;
    let currentRotation = 0;
    let isSpinning = false;
    let audioCtx = null;

    function playWinSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.11);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.11 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.11);
          osc.stop(audioCtx.currentTime + idx * 0.11 + 0.45);
        });
      } catch (e) {}
    }

    function drawWheel() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = cx;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = currentRotation + i * arc;
        const endAngle = startAngle + arc;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.fillStyle = ITEMS[i].color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(ITEMS[i].label, radius - 38, 10);
        ctx.restore();
      }
    }

    function getTargetIndex() {
      const urlParams = new URLSearchParams(window.location.search);
      const winParam = urlParams.get("win");

      if (winParam === "random") return Math.floor(Math.random() * numSlices);
      if (winParam !== null) {
        const parsed = parseInt(winParam, 10);
        if (!isNaN(parsed) && parsed >= 0 && parsed < numSlices) return parsed;
      }
      return DEFAULT_WIN_INDEX;
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;

      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }

      const targetIndex = getTargetIndex();
      const pointerAngle = (3 * Math.PI) / 2;
      const targetSliceCenter = (targetIndex + 0.5) * arc;
      const twoPi = 2 * Math.PI;
      const jitter = (Math.random() - 0.5) * (arc * 0.42);

      const desiredAngle = pointerAngle - targetSliceCenter + jitter;
      const currentMod = ((currentRotation % twoPi) + twoPi) % twoPi;
      const targetMod = ((desiredAngle % twoPi) + twoPi) % twoPi;
      const delta = ((targetMod - currentMod) + twoPi) % twoPi;

      const extraSpins = 7;
      const startRotation = currentRotation;
      const totalChange = extraSpins * twoPi + delta;
      const duration = 4500;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3.5);

        currentRotation = startRotation + totalChange * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          resultText.textContent = ITEMS[targetIndex].label;
          modal.classList.add("show");
          playWinSound();
          launchConfetti();
        }
      }

      requestAnimationFrame(animate);
    }

    function closeModal() {
      modal.classList.remove("show");
    }

    function launchConfetti() {
      const cCanvas = document.getElementById("confettiCanvas");
      const cCtx = cCanvas.getContext("2d");
      cCanvas.width = window.innerWidth;
      cCanvas.height = window.innerHeight;

      const colors = ["#f43f5e", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa"];
      const particles = Array.from({ length: 85 }, () => ({
        x: Math.random() * cCanvas.width,
        y: Math.random() * -cCanvas.height * 0.5,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 4 + 3,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10
      }));

      let frame = 0;
      function renderConfetti() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          cCtx.save();
          cCtx.translate(p.x, p.y);
          cCtx.rotate((p.rot * Math.PI) / 180);
          cCtx.fillStyle = p.color;
          cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cCtx.restore();
        });
        frame++;
        if (frame < 140) {
          requestAnimationFrame(renderConfetti);
        } else {
          cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        }
      }
      requestAnimationFrame(renderConfetti);
    }

    spinBtn.addEventListener("click", spin);
    drawWheel();
  </script>
</body>
</html>
